name: Build Nebula Client Native APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components, NDK, and CMake
        run: |
          yes | sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Generate Gradle Wrapper (8.2)
        run: |
          gradle --version
          gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean and Build Debug APK & arm64-v8a Library
        run: ./gradlew clean assembleDebug

      - name: Verify APK Output Existence
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Lỗi: Không tìm thấy tệp APK đầu ra!"
            exit 1
          fi
          echo "Tệp APK đã tồn tại chính xác."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebulaclient-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
